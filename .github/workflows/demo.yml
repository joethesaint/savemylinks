# Static demo (demo/build.py) on GitHub Pages.
# On every pull request: test and build only, so a broken demo fails on the PR, before merge.
# On main: test, build and publish.
name: Demo site

on:
  pull_request:
    paths: ["app/templates/**", "app/static/**", "demo/**", ".github/workflows/demo.yml", "conftest.py", "pytest.ini"]
  push:
    branches: [main]
    paths: ["app/templates/**", "app/static/**", "demo/**", ".github/workflows/demo.yml", "conftest.py", "pytest.ini"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2==3.1.2 pytest==7.4.3 pytest-asyncio==0.21.1  # the root conftest.py loads pytest_asyncio
      - run: python -m pytest demo/test_build.py -q -p no:cacheprovider
      - run: python demo/build.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
