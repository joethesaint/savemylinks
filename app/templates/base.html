<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SaveMyLinks: save any page in one click and find it again by category.">
    <meta name="theme-color" content="#2f6f7a">
    <!-- Link previews (chat apps, social sites, and SaveMyLinks itself read these). -->
    <meta property="og:site_name" content="SaveMyLinks">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}SaveMyLinks: save any page, find it again{% endblock %}">
    <meta property="og:description" content="Save any page in one move and find it again in seconds. Free, open source, yours.">
    <meta property="og:image" content="https://joethesaint.github.io/savemylinks/static/art/social-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SaveMyLinks: a file box of saved links. Save any page in one move, find it again in seconds.">
    <meta name="twitter:card" content="summary_large_image">
    <title>{% block title %}SaveMyLinks{% endblock %}</title>
    <script>
        // Set the theme before first paint so the page never flashes the wrong colours.
        try { const t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
              else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', path='/sml.css') }}?v=16">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/art/icon.svg') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='/art/icon-32.png') }}">
    <!-- Installable app (add to home screen); on Android it also appears in the Share menu. -->
    <link rel="manifest" href="{{ url_for('static', path='/manifest.webmanifest') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='/art/apple-touch-icon.png') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SaveMyLinks">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>

    <!-- Line icons: 16px, 1.6 stroke, round caps, currentColor (design system). -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></symbol>
        <symbol id="i-link" viewBox="0 0 16 16"><path d="M6.5 9.5 9.5 6.5"/><path d="M7 4.5 8.6 3a2.8 2.8 0 0 1 4 4L11 8.6"/><path d="M9 11.5 7.4 13a2.8 2.8 0 0 1-4-4L5 7.4"/></symbol>
        <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
        <symbol id="i-edit" viewBox="0 0 16 16"><path d="M10.5 2.5l3 3L6 13H3v-3z"/></symbol>
        <symbol id="i-trash" viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></symbol>
        <symbol id="i-close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
        <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></symbol>
        <symbol id="i-moon" viewBox="0 0 16 16"><path d="M13 9.5A5.5 5.5 0 1 1 6.5 3a4.5 4.5 0 0 0 6.5 6.5z"/></symbol>
        <symbol id="i-clip" viewBox="0 0 16 16"><path d="M10.5 5.5 6 10a1.4 1.4 0 0 0 2 2l5-5a2.8 2.8 0 0 0-4-4L4 8a4.2 4.2 0 0 0 6 6l3.5-3.5"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v2.5h-2.5"/></symbol>
        <symbol id="i-check" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M5.2 8.2l1.9 1.9 3.7-3.9"/></symbol>
        <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/><path d="M8 7.2v3.8M8 5h.01"/></symbol>
        <symbol id="i-alert" viewBox="0 0 16 16"><path d="M8 2l6.3 11H1.7z"/><path d="M8 6.5v3M8 11.5h.01"/></symbol>
        <symbol id="i-view-cards" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="4.5" rx="1"/><rect x="2.5" y="9" width="11" height="4.5" rx="1"/></symbol>
        <symbol id="i-view-grid" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></symbol>
        <symbol id="i-view-list" viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></symbol>
    </svg>

    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/" aria-label="SaveMyLinks library">
                <img src="{{ url_for('static', path='/art/icon.svg') }}" alt="" width="28" height="28">
                SaveMyLinks
            </a>
            <nav class="nav" aria-label="Main">
                <a href="/" {% if active == 'library' %}aria-current="page"{% endif %}>Library</a>
                <a href="/add" {% if active == 'add' %}aria-current="page"{% endif %}>Save a link</a>
            </nav>
            <div class="header-tools">
                <button type="button" id="assistantToggle" class="btn btn-ghost btn-sm" aria-pressed="true" hidden>
                    <svg class="icon" aria-hidden="true"><use href="#i-clip"/></svg><span>Hide assistant</span>
                </button>
                <button type="button" id="themeToggle" class="btn btn-ghost btn-icon" aria-label="Switch to dark theme">
                    <svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg>
                </button>
                {% block header_action %}
                <a class="btn btn-primary" href="/add" aria-label="Save a link"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>Save<span class="wide-only"> a link</span></span></a>
                {% endblock %}
            </div>
        </div>
    </header>

    <main id="main-content">
        <div class="wrap">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <span>SaveMyLinks keeps every link you save, filed by category, on your own server.</span>
            <span>Press <kbd>/</kbd> to search, <kbd>?</kbd> for keyboard shortcuts.</span>
        </div>
    </footer>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script src="{{ url_for('static', path='/sml.js') }}?v=8"></script>

    <!-- Assistant (Clippy). Reacts to what happens on the page. Since 22 Nov (#36, the Director's ask)
         he also offers an occasional idle tip, at most 3 a visit, never while you're busy; and a
         double-click on him opens a quick-save box.
         Pages talk to it with events:
           window.dispatchEvent(new CustomEvent('sml:save',  { detail: { status: 201|409|422|0, category, message } }))
           window.dispatchEvent(new CustomEvent('sml:empty', { detail: { search } }))  -->
    <script type="module">
        let agent = null;
        const toggle = document.getElementById('assistantToggle');

        const reactions = {
            201: (d) => ['Congratulate', `Saved${d.category ? ' to ' + d.category : ''}.`, 'saved'],
            409: () => ['LookDown', 'Already saved. This URL is in your library.', 'duplicate'],
            422: (d) => ['Explain', `Not saved. ${d.message || 'Check the highlighted fields.'}`, 'invalid'],
            0:   () => ['Alert', "Couldn't reach the server. Check your connection and try again.", 'invalid'],
        };

        function react(animation, text, tone, duration = 5000) {
            if (!agent || !agent.visible) return;
            if (!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) agent.play(animation, { timeout: 3000 });
            agent.speak(text, { tone, duration });
        }

        window.addEventListener('sml:save', (e) => {
            const d = e.detail || {};
            const r = (reactions[d.status] || reactions[0])(d);
            react(...r, d.status === 201 ? 4000 : 8000);
        });
        window.addEventListener('sml:empty', (e) => {
            const q = e.detail && e.detail.search;
            if (q) react('Searching', `Nothing matches "${q}". Try fewer words or another category.`, '');
            else react('GestureUp', 'No links yet. Use "Save a link" at the top to save your first one.', '', 8000);
        });

        function syncToggle(hidden) {
            if (!toggle) return;
            toggle.hidden = false;
            toggle.setAttribute('aria-pressed', String(!hidden));
            toggle.querySelector('span:last-child').textContent = hidden ? 'Show assistant' : 'Hide assistant';
        }
        window.addEventListener('sml:assistant', (e) => syncToggle(e.detail.hidden));

        // ── Quick save: double-click Clippy, paste, Enter. The full form is one link away. ──
        let quick = null;
        function suggestTitle(raw) {
            try {
                const url = new URL(raw);
                const last = url.pathname.split('/').filter(Boolean).pop();
                let words = last ? decodeURIComponent(last).replace(/\.[a-z0-9]+$/i, '').replace(/[-_+]+/g, ' ').trim() : '';
                if (/\d{6,}|^urn:/i.test(words) || !/[a-z]{3,}/i.test(words)) words = ''; // an ID is no title
                const host = url.hostname.replace(/^www\./, '');
                return words ? `${words.charAt(0).toUpperCase()}${words.slice(1)} (${host})` : host;
            } catch { return ''; }
        }
        function closeQuick() { if (quick) { quick.remove(); quick = null; } }
        async function openQuick() {
            if (!agent || !agent.visible) return;
            if (quick) { quick.querySelector('input').focus(); return; }
            agent.closeBubble();
            quick = document.createElement('form');
            quick.className = 'clippy-quick';
            quick.setAttribute('aria-label', 'Quick save');
            quick.innerHTML = '<label class="clippy-quick-label" for="quickUrl">Save a link</label>'
                + '<div class="clippy-quick-row"><input class="input" id="quickUrl" type="url" inputmode="url" placeholder="Paste a link" autocomplete="off" required>'
                + '<button type="submit" class="btn btn-primary btn-sm">Save</button></div>'
                + '<p class="clippy-quick-help"><a href="/add">More options</a> · Esc to close</p>';
            agent.container.append(quick);
            // Open toward the side with room: he may sit at any edge of the screen.
            const at = agent.container.getBoundingClientRect();
            if (at.left + at.width / 2 < window.innerWidth / 2) { quick.style.left = '0'; quick.style.right = 'auto'; }
            if (at.top < quick.offsetHeight + 20) { quick.style.bottom = 'auto'; quick.style.top = 'calc(100% + 10px)'; }
            const input = quick.querySelector('input');
            const more = quick.querySelector('a');
            const moreBase = more.getAttribute('href'); // add.html on the demo
            input.addEventListener('input', () => { more.href = input.value.trim() ? moreBase + '?prefill=' + encodeURIComponent(input.value.trim()) : moreBase; });
            quick.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); closeQuick(); agent.element.focus(); } });
            quick.addEventListener('submit', async (e) => {
                e.preventDefault();
                let url = input.value.trim();
                if (url && !/^[a-z][a-z0-9+.-]*:/i.test(url)) url = 'https://' + url;
                try { if (!/^https?:$/.test(new URL(url).protocol)) throw 0; }
                catch { react('Explain', 'That doesn\'t look like a web address. It starts with https://', 'invalid', 6000); input.focus(); return; }
                const btn = quick.querySelector('button'); btn.disabled = true; btn.textContent = 'Saving…';
                let status = 0, message = '';
                try {
                    const res = await fetch('/api/resources/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url, title: suggestTitle(url) || url }) });
                    status = res.status;
                    if (status === 422) { const d = await res.json(); message = (window.SML?.fieldErrors?.(d.detail) && Object.values(window.SML.fieldErrors(d.detail))[0]) || ''; }
                } catch { status = 0; }
                closeQuick();
                if (status === 201) {
                    agent.play('Save', { timeout: 3000 });
                    agent.speak('Saved to your library. Its title and picture arrive in a second.', { tone: 'saved', duration: 5000 });
                    window.dispatchEvent(new CustomEvent('sml:saved-elsewhere'));
                } else {
                    window.dispatchEvent(new CustomEvent('sml:save', { detail: { status: status === 409 || status === 422 ? status : 0, message } }));
                }
            });
            input.focus(); // ready to paste at once; the clipboard check below may wait for permission
            // The link you just copied, when the browser lets us read it (it may ask first).
            try {
                const text = (await navigator.clipboard?.readText?.()) || '';
                const found = text.match(/https?:\/\/[^\s<>"']+/);
                if (found && quick && !input.value) { input.value = found[0]; input.dispatchEvent(new Event('input')); input.select(); }
            } catch { /* not allowed: paste by hand */ }
        }
        document.addEventListener('clippy:save', openQuick);
        document.addEventListener('pointerdown', (e) => { if (quick && !e.target.closest('.clippy-agent')) closeQuick(); });

        // ── Idle tips: one now and then while you browse, at most 3 a visit, never while you're busy ──
        const IDLE_TIPS = [
            'Press Ctrl+K to jump to any link, category or tag.',
            'Double-click me to save a link quickly. Paste it and press Enter.',
            'Press v then g for the grid, or v then l for a compact list.',
            'Tags find links across categories. Click a tag on a card to see the rest.',
            'Press / to search from anywhere.',
            'Select a link with j, change it, then press . on the next one to repeat the change.',
            'On your phone, Share a page to SaveMyLinks to save it without copying.',
            'Kept a guessed title? Fetch preview again in the edit window gets the page\'s own.',
        ];
        const IDLE_KEY = 'sml-idle-tips-v1';
        let idleSaid = 0;
        function idleTip() {
            if (idleSaid >= 3) return;
            const busy = !agent || !agent.visible || quick || document.hidden || document.querySelector('dialog[open]')
                || !agent.bubble.hidden || document.activeElement?.closest?.('input, textarea, select, [contenteditable="true"]');
            if (!busy) {
                let seen = [];
                try { seen = JSON.parse(localStorage.getItem(IDLE_KEY) || '[]'); } catch { /* blocked */ }
                let next = IDLE_TIPS.findIndex((_, i) => !seen.includes(i));
                if (next < 0) { seen = []; next = 0; } // said them all: start again
                seen.push(next);
                try { localStorage.setItem(IDLE_KEY, JSON.stringify(seen)); } catch { /* blocked */ }
                idleSaid += 1;
                react('Explain', IDLE_TIPS[next], '', 9000);
            }
            setTimeout(idleTip, (busy ? 60 : 240 + Math.random() * 120) * 1000); // busy: look again in a minute
        }

        async function start() {
            try {
                const { initClippy, assistantPrefs } = await import('/static/modern-clippy.js?v=10');
                agent = await initClippy({ basePath: '/static/' });
                window.smlAssistant = agent;
                const prefs = assistantPrefs.get();
                syncToggle(!!prefs.hidden);
                toggle.addEventListener('click', () => {
                    if (agent.visible) agent.dismiss();
                    else { agent.show(); syncToggle(false); }
                });
                // Greet once per browser, not on every page load.
                if (agent.visible && !prefs.greeted) {
                    setTimeout(() => agent.bubble.hidden && (assistantPrefs.set({ greeted: true }), react('Greeting', "Hi. Save a link and I'll tell you where it was filed. Hide me with the × any time.", '', 9000)), 600);
                }
                window.dispatchEvent(new CustomEvent('sml:assistant-ready'));
                setTimeout(idleTip, 180 * 1000); // the first tip after three minutes
            } catch (error) {
                console.warn('Assistant not loaded:', error.message);
            }
        }

        // Load after the page so it never delays the content.
        if (document.readyState === 'complete') setTimeout(start, 300);
        else window.addEventListener('load', () => setTimeout(start, 300));
    </script>
    <script>
        // Installable and opens offline (sw.js sits at the app's root so it covers every page).
        if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
