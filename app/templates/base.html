<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SaveMyLinks - Your personal link curator and bookmark manager">
    <meta name="theme-color" content="#667eea">
    <title>{% block title %}SaveMyLinks{% endblock %}</title>
    
    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Modern CSS Framework -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
    
    <!-- Three.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.144.0/build/three.min.js"></script>
    
    <!-- Modern Clippy CSS is included in the JS module -->
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
</head>
<body class="has-navbar-fixed-top">
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <!-- Particle Canvas -->
    <canvas id="particle-canvas" aria-hidden="true"></canvas>
    
    <!-- Navigation -->
    <nav class="navbar is-fixed-top has-shadow" role="navigation" aria-label="main navigation">
        <div class="container">
            <div class="navbar-brand">
                <a class="navbar-item brand-logo" href="/">
                    <span class="icon is-medium">
                        <i class="fas fa-link"></i>
                    </span>
                    <strong class="ml-2">SaveMyLinks</strong>
                </a>
                
                <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarBasic">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </a>
            </div>
            
            <div id="navbarBasic" class="navbar-menu">
                <div class="navbar-start">
                    <a class="navbar-item" href="/" aria-label="Go to homepage">
                        <span class="icon" aria-hidden="true">
                            <i class="fas fa-home"></i>
                        </span>
                        <span>Home</span>
                    </a>
                    <a class="navbar-item" href="/add" aria-label="Add new link">
                        <span class="icon" aria-hidden="true">
                            <i class="fas fa-plus"></i>
                        </span>
                        <span>Add Link</span>
                    </a>
                </div>
                
                <div class="navbar-end">
                    <div class="navbar-item">
                        <button id="theme-toggle" class="button is-ghost theme-toggle" 
                                title="Toggle theme" aria-label="Toggle between light and dark theme">
                            <span class="icon" aria-hidden="true">
                                <i id="theme-icon" class="fas fa-sun"></i>
                            </span>
                        </button>
                    </div>
                    <div class="navbar-item">
                        <div class="buttons">
                            <a class="button is-primary is-light" href="/add" aria-label="Add new link">
                                <strong>Add New Link</strong>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Particle Canvas Background -->
    <canvas id="particle-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;"></canvas>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer mt-6">
        <div class="container">
            <div class="content has-text-centered">
                <div class="columns is-vcentered">
                    <div class="column">
                        <p class="is-size-6">
                            <strong>SaveMyLinks</strong> - Your personal link curator
                        </p>
                        <p class="is-size-7 has-text-grey">
                            Organize, search, and manage your bookmarks with ease
                        </p>
                    </div>
                    <div class="column is-narrow">
                        <div class="field is-grouped">
                            <p class="control">
                                <button type="button" id="assistantToggle" class="button is-small is-outlined" aria-pressed="true">
                                    <span class="icon" aria-hidden="true"><i class="fas fa-paperclip"></i></span>
                                    <span>Hide assistant</span>
                                </button>
                            </p>
                            <p class="control">
                                <a class="button is-small is-outlined" href="https://github.com" target="_blank">
                                    <span class="icon">
                                        <i class="fab fa-github"></i>
                                    </span>
                                    <span>GitHub</span>
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- JavaScript for mobile menu -->
    <script>
        // Mobile menu functionality
        document.addEventListener('DOMContentLoaded', () => {
            const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);
            
            if ($navbarBurgers.length > 0) {
                $navbarBurgers.forEach(el => {
                    el.addEventListener('click', () => {
                        const target = el.dataset.target;
                        const $target = document.getElementById(target);
                        
                        el.classList.toggle('is-active');
                        $target.classList.toggle('is-active');
                    });
                });
            }
        });

        // Theme switching functionality
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            const themeIcon = document.getElementById('theme-icon');
            const html = document.documentElement;
            
            // Check for saved theme preference or default to 'light'
            const currentTheme = localStorage.getItem('theme') || 'light';
            html.setAttribute('data-theme', currentTheme);
            updateThemeIcon(currentTheme);
            
            themeToggle.addEventListener('click', () => {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                // Add animation class
                themeToggle.classList.add(newTheme === 'dark' ? 'dimming' : 'lighting');
                
                // Change theme after a short delay for animation
                setTimeout(() => {
                    html.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                    updateThemeIcon(newTheme);
                    
                    // Remove animation class after animation completes
                    setTimeout(() => {
                        themeToggle.classList.remove('dimming', 'lighting');
                    }, 600);
                }, 100);
            });
            
            function updateThemeIcon(theme) {
                if (theme === 'dark') {
                    themeIcon.className = 'fas fa-moon';
                } else {
                    themeIcon.className = 'fas fa-sun';
                }
            }
            
            // Enhanced Particle system with green dust effects
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            
            let particles = [];
            let mouse = { x: 0, y: 0 };
            
            // Particle class with enhanced green effects
            class Particle {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.size = Math.random() * 3 + 1;
                    this.opacity = Math.random() * 0.8 + 0.2;
                    this.hue = 120 + Math.random() * 60; // Green spectrum
                    this.life = Math.random() * 200 + 100;
                    this.maxLife = this.life;
                }
                
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    
                    // Mouse interaction - stronger repulsion
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 120) {
                        const force = (120 - distance) / 120;
                        this.vx += (dx / distance) * force * 0.3;
                        this.vy += (dy / distance) * force * 0.3;
                    }
                    
                    // Boundary bouncing
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -0.8;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -0.8;
                    
                    // Keep particles in bounds
                    this.x = Math.max(0, Math.min(canvas.width, this.x));
                    this.y = Math.max(0, Math.min(canvas.height, this.y));
                    
                    // Friction
                    this.vx *= 0.99;
                    this.vy *= 0.99;
                    
                    // Life cycle
                    this.life--;
                    this.opacity = (this.life / this.maxLife) * 0.8;
                }
                
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.opacity;
                    
                    // Glowing effect
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
                    gradient.addColorStop(0, `hsla(${this.hue}, 70%, 60%, 0.8)`);
                    gradient.addColorStop(0.5, `hsla(${this.hue}, 60%, 50%, 0.4)`);
                    gradient.addColorStop(1, `hsla(${this.hue}, 50%, 40%, 0)`);
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Core particle
                    ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${this.opacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();
                }
            }
            
            function setCanvasSize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            
            function initParticles() {
                particles = [];
                const particleCount = Math.min(80, Math.floor((canvas.width * canvas.height) / 15000));
                
                // Green color palette
                const greenShades = [
                    'rgba(34, 197, 94, 0.8)',   // Primary green
                    'rgba(22, 163, 74, 0.7)',  // Dark green
                    'rgba(74, 222, 128, 0.6)', // Light green
                    'rgba(5, 150, 105, 0.8)',  // Secondary green
                    'rgba(132, 204, 22, 0.7)', // Accent green
                    'rgba(163, 230, 53, 0.6)'  // Bright green
                ];
                
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height
                    ));
                }
            }
            
            function drawConnections() {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < 100) {
                            const opacity = (1 - distance / 100) * 0.3;
                            ctx.strokeStyle = `rgba(34, 197, 94, ${opacity})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
            }
            
            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Update and draw particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    
                    // Remove dead particles
                    if (particles[i].life <= 0) {
                        particles.splice(i, 1);
                    }
                }
                
                // Add new particles to maintain count
                while (particles.length < Math.min(80, Math.floor((canvas.width * canvas.height) / 15000))) {
                    particles.push(new Particle(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height
                    ));
                }
                
                // Draw connections
                drawConnections();
                
                requestAnimationFrame(animateParticles);
            }
            
            // Mouse tracking with enhanced interaction
            document.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            
            // Initialize particle system
            setCanvasSize();
            initParticles();
            animateParticles();
            
            // Handle window resize
            window.addEventListener('resize', () => {
                setCanvasSize();
                initParticles();
            });
        });
    </script>
    
    <!-- Assistant (Clippy). Reacts to what happens on the page; never interrupts on a timer.
         Pages talk to it with events:
           window.dispatchEvent(new CustomEvent('sml:save',  { detail: { status: 201|409|422|0, category, message } }))
           window.dispatchEvent(new CustomEvent('sml:empty', { detail: { search } }))  -->
    <script type="module">
        let agent = null;
        const toggle = document.getElementById('assistantToggle');

        const reactions = {
            201: (d) => ['Congratulate', `Saved${d.category ? ' to ' + d.category : ''}.`, 'saved'],
            409: () => ['LookDown', 'Already saved. This URL is in your library.', 'duplicate'],
            422: (d) => ['Explain', `Not saved. ${d.message || 'Check the highlighted fields.'}`, 'invalid'],
            0:   () => ['Alert', "Couldn't reach the server. Check your connection and try again.", 'invalid'],
        };

        function react(animation, text, tone, duration = 5000) {
            if (!agent || !agent.visible) return;
            agent.play(animation, { timeout: 3000 });
            agent.speak(text, { tone, duration });
        }

        window.addEventListener('sml:save', (e) => {
            const d = e.detail || {};
            const r = (reactions[d.status] || reactions[0])(d);
            react(...r, d.status === 201 ? 4000 : 8000);
        });
        window.addEventListener('sml:empty', (e) => {
            const q = e.detail && e.detail.search;
            if (q) react('Searching', `Nothing matches "${q}". Try fewer words or another category.`, '');
            else react('GestureUp', 'No links yet. Use "Add Link" at the top to save your first one.', '', 8000);
        });

        function syncToggle(hidden) {
            if (!toggle) return;
            toggle.setAttribute('aria-pressed', String(!hidden));
            toggle.querySelector('span:last-child').textContent = hidden ? 'Show assistant' : 'Hide assistant';
        }
        window.addEventListener('sml:assistant', (e) => syncToggle(e.detail.hidden));

        async function start() {
            try {
                const { initClippy, assistantPrefs } = await import('/static/modern-clippy.js');
                agent = await initClippy({ basePath: '/static/' });
                window.smlAssistant = agent;
                const prefs = assistantPrefs.get();
                syncToggle(!!prefs.hidden);
                toggle && toggle.addEventListener('click', () => {
                    if (agent.visible) agent.dismiss();
                    else { agent.show(); syncToggle(false); }
                });
                // Greet once per browser, not on every page load.
                if (agent.visible && !prefs.greeted) {
                    setTimeout(() => agent.bubble.hidden && (assistantPrefs.set({ greeted: true }), react('Greeting', "Hi. Save a link and I'll tell you where it was filed. Hide me with the × any time.", '', 9000)), 600);
                }
                window.dispatchEvent(new CustomEvent('sml:assistant-ready'));
            } catch (error) {
                console.warn('Assistant not loaded:', error.message);
                toggle && (toggle.hidden = true);
            }
        }

        // Load after the page so it never delays the content.
        if (document.readyState === 'complete') setTimeout(start, 300);
        else window.addEventListener('load', () => setTimeout(start, 300));
    </script>
    
</body>
</html>
