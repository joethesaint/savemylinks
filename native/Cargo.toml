[package]
name = "savemylinks"
version = "0.1.0"
edition = "2021"
description = "SaveMyLinks as one small program: your own library, real link previews, no setup."
license = "MIT"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.19"
rust-embed = "8"
mime_guess = "2"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
webbrowser = "1"

# The icon by the clock (tray.rs). Linux keeps the terminal: a tray there needs GTK.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.19"
tao = "0.30"
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
